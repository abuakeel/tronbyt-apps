---
id: nyc-subway
name: NYC Subway
summary: Real-time subway departures
desc: >-
  Recreation of Tidbyt's closed-source first-party NYC Subway app. Shows the next
  train in each direction at one station, with the official MTA route bullet.
  Station-configurable via a typeahead picker in the app's config UI (search by
  station name; results are labelled with their route letters since many station
  names are shared by more than one stop) -- install the app more than once, one
  per station, to show several stations in rotation.
  NOTE: the tronbyt server IGNORES this file for user-repo apps -- metadata comes
  from the directory name. Kept for documentation only.
  Failure behaviour: an HTTP-level feed failure (4xx/5xx from api.subwaynow.app)
  is handled gracefully -- both rows render "NO TRAINS" with a dim bullet. A
  WAN/DNS outage is NOT recoverable from app code: Pixlet's Starlark has no
  try/except, and a transport-level failure inside http.get() (DNS resolution,
  connection refused, timeout) aborts the whole render with a fatal Starlark
  error before any app code runs, regardless of how defensively fetch_json is
  written. In that case the app produces no frame at all; tronbyt simply skips
  it in the rotation until the next successful render. This is a limitation of
  every Pixlet app, not app-specific behaviour -- see tools/gate.py's module
  docstring and the Task 5 report for how this was verified (read pixlet's own
  runtime/modules/starlarkhttp source, and reproduced the fatal error directly).
  The reassuring half of that story (final review, confirmed by reading
  tronbyt/server's own source): a render failure is NOT sticky. The server
  sets EmptyLastRender=true and rotation skips the app that cycle
  (rotation.go:217,240,311), but LastRender is updated regardless, so the
  server retries the render at the next UInterval automatically -- there is no
  broken flag set by a failed render and no manual re-enable needed. ("broken"
  is a separate, manual UI-only curation flag an operator sets by hand; a
  render failure never sets it.) A pinned app falls through to normal rotation
  without being unpinned (rotation.go:249) rather than getting stuck. So a WAN
  or DNS outage is transient and self-recovering: the app blinks out of
  rotation while the outage lasts and resumes on its own the moment
  api.subwaynow.app is reachable again, with no operator action required.
author: recreation of a Tidbyt original
fileName: nyc-subway.star
packageName: nyc-subway
