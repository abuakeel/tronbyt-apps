---
id: nycsubway
name: NYC Subway
summary: Real-time subway departures
desc: >-
  Recreation of Tidbyt's closed-source first-party NYC Subway app. Shows the next
  train in each direction at one station, with the official MTA route bullet.
  NOTE: the tronbyt server IGNORES this file for user-repo apps -- metadata comes
  from the directory name. Kept for documentation only.
  Failure behaviour: an HTTP-level feed failure (4xx/5xx from api.subwaynow.app)
  is handled gracefully -- both rows render "NO TRAINS" with a dim bullet. A
  WAN/DNS outage is NOT recoverable from app code: Pixlet's Starlark has no
  try/except, and a transport-level failure inside http.get() (DNS resolution,
  connection refused, timeout) aborts the whole render with a fatal Starlark
  error before any app code runs, regardless of how defensively fetch_json is
  written. In that case the app produces no frame at all; tronbyt simply skips
  it in the rotation until the next successful render. This is a limitation of
  every Pixlet app, not app-specific behaviour -- see tools/gate.py's module
  docstring and the Task 5 report for how this was verified (read pixlet's own
  runtime/modules/starlarkhttp source, and reproduced the fatal error directly).
author: recreation of a Tidbyt original
fileName: nycsubway.star
packageName: nycsubway
